<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات | Smart Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .settings-card {
            padding: 25px;
            border-radius: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                color: white;
                margin-bottom: 8px;
                font-size: 0.9rem;
            }

            .form-group input, .form-group select {
                width: 100%;
                padding: 10px;
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 8px;
                color: white;
                outline: none;
            }

                .form-group input:focus, .form-group select:focus {
                    border-color: #a855f7;
                }

        .save-btn {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

            .save-btn:hover {
                opacity: 0.9;
                transform: translateY(-2px);
            }

        @media (max-width: 768px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="admin-ui">
    <div class="admin-bg-orbs"></div>

    <div class="admin-layout">
        <aside class="admin-sidebar glass-panel">
            <div class="brand-title">
                <i class="fas fa-shopping-basket"></i> Smart Admin
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-home"></i> لوحة التحكم</a>
                <a href="admin-products.html" class="nav-item"><i class="fas fa-box-open"></i> المنتجات</a>
                <a href="admin-users.html" class="nav-item"><i class="fas fa-users"></i> المستخدمين</a>
                <a href="admin-orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i> الطلبات</a>
                <a href="admin-settings.html" class="nav-item active"><i class="fas fa-cog"></i> الإعدادات</a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header glass-panel" style="display: flex; justify-content: space-between; padding: 20px 30px;">
                <div class="header-content">
                    <h2 style="color: white;">إعدادات النظام ⚙️</h2>
                </div>
            </header>

            <div class="settings-grid">
                <div class="settings-card glass-panel">
                    <h3 style="color: white; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                        <i class="fas fa-store"></i> إعدادات المتجر
                    </h3>
                    <form id="storeSettingsForm">
                        <div class="form-group">
                            <label>اسم الشركة / المتجر</label>
                            <input type="text" id="storeName" value="شركة عبود وعز ومالك التجارية" required>
                        </div>
                        <div class="form-group">
                            <label>البريد الإلكتروني للتواصل</label>
                            <input type="email" id="contactEmail" value="contact@smart.com" required>
                        </div>
                        <div class="form-group">
                            <label>العملة الافتراضية</label>
                            <select id="storeCurrency">
                                <option style="color: black;" value="USD" selected>دولار أمريكي ($)</option>
                                <option style="color: black;" value="JOD">دينار أردني (JOD)</option>
                                <option style="color: black;" value="SAR">ريال سعودي (SAR)</option>
                            </select>
                        </div>
                        <button type="submit" class="save-btn"><i class="fas fa-save"></i> حفظ إعدادات المتجر</button>
                        <p id="storeMsg" style="text-align: center; margin-top: 10px; font-size: 0.9rem;"></p>
                    </form>
                </div>

                <div class="settings-card glass-panel">
                    <h3 style="color: white; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                        <i class="fas fa-user-shield"></i> الأمان وحساب المدير
                    </h3>
                    <form id="securitySettingsForm">
                        <div class="form-group">
                            <label>البريد الإلكتروني الحالي</label>
                            <input type="email" id="adminEmail" value="admin@smart.com" disabled style="opacity: 0.7;">
                        </div>
                        <div class="form-group">
                            <label>كلمة المرور الجديدة</label>
                            <input type="password" id="newPassword" placeholder="أدخل كلمة المرور الجديدة" required>
                        </div>
                        <div class="form-group">
                            <label>تأكيد كلمة المرور</label>
                            <input type="password" id="confirmNewPassword" placeholder="أعد إدخال كلمة المرور" required>
                        </div>
                        <button type="submit" class="save-btn" style="background: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);">
                            <i class="fas fa-key"></i> تحديث كلمة المرور
                        </button>
                        <p id="securityMsg" style="text-align: center; margin-top: 10px; font-size: 0.9rem;"></p>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
