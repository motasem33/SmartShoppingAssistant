<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استعادة كلمة المرور | Smart Shopping</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="login-wrapper">
        <div class="glass-card">
            <div class="logo-section">
                <i class="fas fa-key"></i>
                <h1>استعادة الحساب</h1>
                <p>أدخل بريدك الإلكتروني لإرسال رابط الاستعادة</p>
            </div>

            <form id="forgotForm">
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="resetEmail" placeholder="البريد الإلكتروني" required>
                </div>
                <button type="submit" class="btn-primary">إرسال الرابط</button>
            </form>

            <div class="footer-links">
                <a href="index.html">العودة لتسجيل الدخول</a>
            </div>
            <div id="statusMsg" class="status-msg"></div>
        </div>
    </div>

    <script>
        // كود بسيط فقط للمنظر
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = document.getElementById('statusMsg');
            msg.style.color = "#059669";
            msg.innerText = "✅ إذا كان الحساب موجوداً، فستصلك رسالة قريباً!";
            setTimeout(() => { window.location.href = 'index.html'; }, 3000);
        });
    </script>
</body>
</html>
