<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | Smart Shopping</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="login-wrapper">
        <div class="glass-card">
            <div class="logo-section">
                <i class="fas fa-user-plus"></i>
                <h1>حساب جديد</h1>
                <p>انضم إلينا وابدأ تجربة تسوق ذكية</p>
            </div>

            <form id="registerForm">
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regName" placeholder="الاسم الكامل" required>
                </div>
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="كلمة المرور" required>
                </div>
                <div class="input-container">
                    <i class="fas fa-check-double"></i>
                    <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
                </div>

                <button type="submit" class="btn-primary">إنشاء الحساب</button>
            </form>

            <div class="footer-links">
                لديك حساب بالفعل؟ <a href="index.html">تسجيل الدخول</a>
            </div>
            <div id="regMessage" class="status-msg"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
