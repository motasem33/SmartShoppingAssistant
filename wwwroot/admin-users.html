<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين | Smart Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-ui">
    <div class="admin-bg-orbs"></div>

    <div class="admin-layout">
        <aside class="admin-sidebar glass-panel">
            <div class="brand-title">
                <i class="fas fa-shopping-basket"></i> Smart Admin
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item"><i class="fas fa-home"></i> لوحة التحكم</a>
                <a href="admin-products.html" class="nav-item"><i class="fas fa-box-open"></i> المنتجات</a>
                <a href="admin-users.html" class="nav-item"><i class="fas fa-users"></i> المستخدمين</a>
                <a href="admin-orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i> الطلبات</a>              
                <a href="admin-settings.html" class="nav-item"><i class="fas fa-cog"></i> الإعدادات</a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="window.location.href='index.html'">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header glass-panel" style="display: flex; justify-content: space-between; padding: 20px 30px;">
                <div class="header-content">
                    <h2 style="color: white;">إدارة المستخدمين 👥</h2>
                </div>
                <button class="btn-primary" style="width: auto; padding: 10px 25px; font-size: 0.95rem;" onclick="openUserModal()">
                    <i class="fas fa-user-plus"></i> إضافة مستخدم
                </button>
            </header>

            <div class="glass-panel" style="padding: 20px; overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>الرقم</th>
                            <th>البريد الإلكتروني</th>
                            <th>الصلاحية</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersTable">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #94a3b8;">جاري تحميل المستخدمين...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="userModal" class="modal-overlay">
        <div class="glass-card modal-content" style="max-width: 500px; padding: 30px;">
            <h2 style="color: white; margin-bottom: 20px;">إضافة مستخدم جديد</h2>
            <form id="addUserForm">
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="userEmail" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="userPassword" placeholder="كلمة المرور" required>
                </div>
                <div class="input-container" style="text-align: right;">
                    <select id="userRole" style="width: 100%; padding: 15px; background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; color: #f8fafc; font-size: 1rem; outline: none; cursor: pointer;">
                        <option value="User" style="color: black;">مستخدم عادي (User)</option>
                        <option value="Admin" style="color: black;">مشرف (Admin)</option>
                    </select>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 25px;">
                    <button type="submit" class="btn-primary">حفظ المستخدم</button>
                    <button type="button" class="btn-admin" onclick="closeUserModal()">إلغاء</button>
                </div>
                <div id="userModalMsg" class="status-msg"></div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
